name: Refresh RIPE data

on:
  schedule:
    - cron: '0 0 * * 0'  # weekly, Sunday 01:23 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Download RIPE data and resolve names
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: data-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: ./.github/actions/setup

      - name: Refresh data/ (RIPEstat + RIPE DB dumps)
        run: scripts/refresh-ripe-data.sh "${RUNNER_TEMP}/ripe"

      - uses: ./.github/actions/commit-push
        with:
          paths: data
          message: Refresh RIPE data

  rebuild:
    name: Rebuild blacklists
    needs: refresh
    permissions:
      contents: write
    uses: ./.github/workflows/update-blacklists.yml
